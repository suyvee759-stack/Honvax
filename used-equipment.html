<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Construction Equipment | Honvax EPC Packages</title>
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .audit-card { border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <header class="p-3 bg-white border-bottom">
    <div class="container d-flex justify-content-between">
      <a href="index.html" class="text-decoration-none text-dark fw-bold">HONVAX</a>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="used-equipment.html" class="text-primary fw-bold">Used Equipment</a></li>
          <li><a href="rfq-system.html">RFQ System</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container py-5">
    <h1>Construction Equipment & Assets</h1>
    <div id="machinery-gallery-json" class="row">
      </div>
  </main>

  <script>
    // 保持你原有的 JSON 加载逻辑，并确保跳转逻辑一致
    window.addToRFQ = function(button, itemName) { 
      let cart = JSON.parse(localStorage.getItem('honvax_rfq') || '[]');
      if (!cart.includes(itemName)) { cart.push(itemName); localStorage.setItem('honvax_rfq', JSON.stringify(cart)); }
      button.innerHTML = `Added! Redirecting...`; 
      button.classList.add('added'); 
      setTimeout(() => { window.location.href = 'rfq-system.html'; }, 500);
    };

    // 原有的设备加载 fetch 逻辑保持不变...
  </script>
</body>
</html>
