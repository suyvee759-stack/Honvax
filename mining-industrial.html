<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mining Process & Industrial | Honvax EPC Packages</title>
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* 保持与上面相同的 Style 结构 */
    :root { --accent-color: #10558C; }
    .sku-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; padding: 25px; height: 100%; transition: 0.3s; }
    .btn-rfq { width: 100%; font-weight: 700; border: 1px solid var(--accent-color); }
    .btn-rfq.added { background-color: #10b981; color: #fff; border-color: #10b981; }
  </style>
</head>
<body>
  <header id="header" class="header fixed-top bg-white border-bottom p-3">
    <div class="container d-flex justify-content-between">
      <a href="index.html" class="text-decoration-none text-dark fw-bold">HONVAX</a>
      <nav class="navmenu">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li class="dropdown"><a href="#" class="active">Procurement Packages</a>
            <ul>
              <li><a href="water-utilities.html">Bulk Water</a></li>
              <li><a href="solar-grid.html">Solar BoP</a></li>
              <li><a href="mining-industrial.html" class="active">Mining Process</a></li>
              <li><a href="used-equipment.html">Construction Equipment</a></li>
            </ul>
          </li>
          <li><a href="rfq-system.html">RFQ System</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main style="padding-top: 100px;">
    <section class="container py-5">
      <h1>Mining Process & Industrial</h1>
      <div class="row gy-4">
        <div class="col-lg-4">
          <div class="sku-card">
            <h5 class="fw-bold">High-Manganese Bucket Teeth</h5>
            <p class="small text-muted">Severe-duty GET components for excavators.</p>
            <button class="btn btn-outline-primary btn-rfq" onclick="addToRFQ(this, 'High-Manganese Bucket Teeth')">Add to RFQ List</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    window.addToRFQ = function(button, itemName) { 
      let cart = JSON.parse(localStorage.getItem('honvax_rfq') || '[]');
      if (!cart.includes(itemName)) { cart.push(itemName); localStorage.setItem('honvax_rfq', JSON.stringify(cart)); }
      button.innerHTML = `Added! Redirecting...`; 
      button.classList.add('added'); 
      setTimeout(() => { window.location.href = 'rfq-system.html'; }, 500);
    };
  </script>
</body>
</html>
